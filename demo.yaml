- id: scene_09_upload
  title: Upload de Arquivo SPED
  narration: Aqui está a dropzone. Arrasto o arquivo SPED da Petrobras. O progresso
    mostra o streaming em tempo real. O job entra na fila como Aguardando, depois
    Em Processamento, e quando termina vira Sucesso com as linhas processadas.
  pause_after: 1.0
  actions:
